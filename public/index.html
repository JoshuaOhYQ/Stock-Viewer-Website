<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moo Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Moo Viewer home">
      <span class="brand-cow">🐮</span>
      <span class="brand-name">Moo<b>Viewer</b></span>
    </a>

    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
      <input id="search" type="text" placeholder="Search symbol or company  ( / )" autocomplete="off" spellcheck="false" />
      <ul id="search-results" class="search-results" hidden></ul>
    </div>

    <div class="topbar-right">
      <span id="market-status" class="market-status"><i></i><span>—</span></span>
      <button id="color-toggle" class="ghost-btn" title="Swap up/down colours">
        <span class="dot up"></span><span class="dot down"></span>
      </button>
    </div>
  </header>

  <div id="indices" class="indices"></div>

  <main class="layout">
    <aside class="panel watchlist-panel">
      <div class="panel-head">
        <h2>Watchlist</h2>
        <button id="add-current" class="ghost-btn small" title="Add current symbol">+ Add</button>
      </div>
      <ul id="watchlist" class="watchlist"></ul>
    </aside>

    <section class="panel detail">
      <div class="quote-head">
        <div class="quote-title">
          <div class="sym-row">
            <h1 id="q-symbol">—</h1>
            <span id="q-exchange" class="chip"></span>
            <button id="star" class="star" title="Toggle watchlist" aria-pressed="false">★</button>
          </div>
          <div id="q-name" class="q-name"></div>
        </div>
        <div class="quote-price">
          <div id="q-price" class="price mono">—</div>
          <div id="q-change" class="change mono"></div>
          <div id="q-time" class="q-time"></div>
        </div>
      </div>

      <div class="chart-toolbar">
        <div id="ranges" class="tabs">
          <button data-range="1d" class="active">1D</button>
          <button data-range="5d">5D</button>
          <button data-range="1mo">1M</button>
          <button data-range="3mo">3M</button>
          <button data-range="6mo">6M</button>
          <button data-range="ytd">YTD</button>
          <button data-range="1y">1Y</button>
          <button data-range="5y">5Y</button>
          <button data-range="max">All</button>
        </div>
        <div id="chart-type" class="tabs">
          <button data-type="line" class="active" title="Line">Line</button>
          <button data-type="candle" title="Candles">Candle</button>
        </div>
      </div>

      <div class="chart-wrap">
        <div id="legend" class="legend mono"></div>
        <div id="chart" class="chart"></div>
        <div id="chart-msg" class="chart-msg" hidden></div>
      </div>

      <div class="stats" id="stats"></div>
    </section>

    <aside class="panel news-panel">
      <div class="panel-head"><h2>News</h2></div>
      <ul id="news" class="news"></ul>
    </aside>
  </main>

  <footer class="foot">Data from Yahoo Finance, may be delayed. Not investment advice. Moo responsibly 🐄</footer>

  <script src="app.js"></script>
</body>
</html>
